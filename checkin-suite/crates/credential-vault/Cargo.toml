[package]
name = "credential-vault"
version = "0.1.0"
edition = "2021"
description = "Local OS-keychain credential vault for WorkBuddy / Trae CN (MemoryBackend + Windows CredMan)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "=1.11.0", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
percent-encoding = "2"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
] }

[dev-dependencies]
tempfile = "3"

[lib]
name = "credential_vault"
path = "src/lib.rs"
